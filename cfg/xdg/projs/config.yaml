vm: aerospace
profile: codex
pathPrefix: ~/dev

defaults:
  terminal: ghostty
  browser: helium
  editor: zed

windowManagers:
  aerospace:
    parkingWorkspace: unrelated

profiles:
  codex: {}

projects:
  userland:
    name: Userland
    aliases: ["cfg", "aerospace", "raycast"]
    path: ~/.userland
    apps:
      browser:
        tabs:
          - https://github.com/GiacomoGuidotto/userland
      terminal: {}
      editor: {}

  anypinn:
    name: AnyPinn
    path: research/anypinn
    apps:
      browser:
        tabs:
          - https://github.com/giacomoguidotto/anypinn
      terminal: {}
      editor: {}

  ginevrarenier:
    name: Ginevra Renier
    aliases: ["ginevra"]
    path: life/ginevrarenier
    apps:
      browser:
        tabs:
          - https://github.com/giacomoguidotto/ginevrarenier
      terminal: {}
      editor: {}

  guidotto-dev:
    name: guidotto.dev
    path: life/guidotto.dev
    apps:
      browser:
        tabs:
          - https://github.com/giacomoguidotto/guidotto.dev
      terminal: {}
      editor: {}

  home-storage:
    name: Home Storage
    path: life/home-storage
    apps:
      browser:
        tabs:
          - https://github.com/giacomoguidotto/home-storage
      terminal: {}
      editor: {}
