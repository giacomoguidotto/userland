vm: aerospace
profile: codex
pathPrefix: ~/dev

defaults:
  terminal: ghostty
  browser: helium
  editor: zed

windowManagers:
  aerospace:
    parkingWorkspace: unrelated

profiles:
  codex: {}

projects:
  userland:
    name: Userland
    aliases: ["cfg", "aerospace", "raycast"]
    path: life/userland
    apps:
      browser:
        tabs:
          - https://github.com/GiacomoGuidotto/userland
      terminal: {}
      editor: {}

  pmp:
    name: Personal Mastery Program
    aliases: ["personal-mastery-program", "mastery"]
    path: uni/personal-mastery-program
    apps:
      browser:
        tabs:
          - https://github.com/giacomoguidotto/personal-mastery-program
      terminal: {}
      editor: {}

  anypinn:
    name: AnyPinn
    path: uni/anypinn
    apps:
      browser:
        tabs:
          - https://github.com/giacomoguidotto/anypinn
      terminal: {}
      editor: {}

  ea-poc:
