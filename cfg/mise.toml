min_version = "2026.9.6"

[settings]
lockfile = true
jobs = 4

[tool_config]
locked = true

[tools]
node = "24.19.0"
op = "2.39.0"
"npm:@openai/codex" = "0.148.0"
"aqua:anthropics/claude-code" = "2.1.280"
"aqua:atuinsh/atuin" = "18.22.0"
"aqua:aristocratos/btop" = { version = "1.4.7", os = ["linux"] }
"aqua:sharkdp/bat" = "0.26.1"
"aqua:eza-community/eza" = { version = "0.23.5", os = ["linux"] }
"aqua:sharkdp/fd" = "10.5.0"
"aqua:junegunn/fzf" = "0.74.4"
"aqua:cli/cli" = "2.101.0"
"aqua:dandavison/delta" = "0.19.2"
"aqua:jqlang/jq" = "1.8.2"
"aqua:jesseduffield/lazygit" = "0.65.1"
"aqua:neovim/neovim" = "0.12.5"
"aqua:BurntSushi/ripgrep" = "15.2.0"
"aqua:starship/starship" = "1.26.0"
"aqua:ajeetdsouza/zoxide" = "0.10.0"

# Native system packages are managed through Mise; application updates follow
# vendor releases. cfg/mise.lock pins the portable tools above. btop and eza
# are Linux-only here because their upstream releases have no macOS archive;
# Mise's macOS package declarations below supply the Homebrew formulas.
[bootstrap.packages]
"brew:git" = { version = "latest", os = ["macos"] }
"brew:duti" = { version = "latest", os = ["macos"] }
"brew:btop" = { version = "latest", os = ["macos"] }
"brew:eza" = { version = "latest", os = ["macos"] }
"apt:git" = { version = "latest", os = ["linux"] }
"apt:zsh" = { version = "latest", os = ["linux"] }
"dnf:git" = { version = "latest", os = ["linux"] }
"dnf:zsh" = { version = "latest", os = ["linux"] }
"pacman:git" = { version = "latest", os = ["linux"] }
"pacman:zsh" = { version = "latest", os = ["linux"] }
# Git is provided by the operating system on Linux/Termux. All macOS formulas,
# including the two tools without upstream Mac archives, are declared above.

[dotfiles]
"~/.config/userland/zshrc" = { source = "home/zshrc", mode = "symlink" }
"~/.zshenv" = { source = "home/zshenv", mode = "symlink" }
"~/.hushlogin" = { source = "home/hushlogin", mode = "symlink" }
"~/.local/bin/userland-secrets" = { source = "home/bin/userland-secrets", mode = "symlink" }
"~/.local/bin/userland-git-sign" = { source = "home/bin/userland-git-sign", mode = "symlink" }
"~/.config/userland/ssh/config" = { source = "home/ssh/config", mode = "symlink" }
"~/.ssh/life-auth.pub" = { source = "home/ssh/life-auth.pub", mode = "symlink" }
"~/.ssh/userland-known_hosts" = { source = "home/ssh/userland-known_hosts", mode = "symlink" }
"~/.config/1Password/ssh/agent.toml" = { source = "home/1Password/ssh/agent.toml", mode = "symlink" }
"~/.agents/skills" = { source = "agents/skills", mode = "symlink-each" }
"~/.codex/skills/t3-code-threads" = { source = "agents/skills/t3-code-threads", mode = "symlink" }
"~/.codex/config.toml" = { source = "codex/config.toml", mode = "symlink" }

"~/.config/atuin" = { source = "xdg/atuin", mode = "symlink-each" }
"~/.config/bat" = { source = "xdg/bat", mode = "symlink-each" }
"~/.config/btop" = { source = "xdg/btop", mode = "symlink-each" }
"~/.config/ghostty" = { source = "xdg/ghostty", mode = "symlink-each" }
"~/.config/git" = { source = "xdg/git", mode = "symlink-each" }
"~/.config/gh" = { source = "xdg/gh", mode = "symlink-each" }
"~/.config/mise" = { source = "xdg/mise", mode = "symlink-each" }
"~/.config/nvim" = { source = "xdg/nvim", mode = "symlink-each" }
"~/.config/starship" = { source = "xdg/starship", mode = "symlink-each" }

[bootstrap.macos.dock]
autohide = true
orientation = "bottom"
show_recents = false
# Keep the Dock empty until an application is running.
apps = []

[bootstrap.hooks.post-defaults]
run = "defaults write com.apple.dock persistent-apps -array && defaults write com.apple.dock persistent-others -array && killall Dock || true"

[bootstrap.macos.defaults."com.apple.finder"]
AppleShowAllExtensions = true
AppleShowAllFiles = true
CreateDesktop = false
ShowExternalHardDrivesOnDesktop = false
ShowHardDrivesOnDesktop = false
ShowMountedServersOnDesktop = false
ShowRemovableMediaOnDesktop = false
FXPreferredViewStyle = "Nlsv"
QuitMenuItem = true
NewWindowTarget = "PfHm"

[bootstrap.macos.defaults."com.apple.WindowManager"]
# Keep the desktop as a clean workspace; widgets remain available in
# Notification Center.
StandardHideWidgets = true
StageManagerHideWidgets = true

[bootstrap.macos.defaults."com.apple.screensaver"]
# Start the screensaver after 20 minutes and lock as soon as it starts.
idleTime = 1200
askForPassword = true
askForPasswordDelay = 0

[bootstrap.macos.defaults.NSGlobalDomain]
InitialKeyRepeat = 20
KeyRepeat = 2
ApplePressAndHoldEnabled = false
NSWindowShouldDragOnGesture = true
AppleInterfaceStyle = "Dark"
_HIHideMenuBar = true
"com.apple.sound.beep.feedback" = 0
"com.apple.sound.beep.volume" = 0.0

[bootstrap.macos.defaults."com.apple.dock"]
expose-group-apps = true
largesize = 16
magnification = false
mineffect = "genie"
minimize-to-application = true
# Keep the raw preference empty as well as the friendly declaration above. This
# makes verification exact on mise versions that do not project Dock apps into
# the raw defaults status.
"persistent-apps" = []
# Remove Downloads, Trash, and other persistent Dock items as well.
"persistent-others" = []
tilesize = 36
wvous-tl-corner = 2
wvous-tr-corner = 12
wvous-bl-corner = 5
wvous-br-corner = 5

[bootstrap.macos.defaults."com.apple.spaces"]
spans-displays = true

[bootstrap.macos.defaults."com.apple.AppleMultitouchTrackpad"]
ActuateDetents = 1
Clicking = true
DragLock = 0
Dragging = 0
FirstClickThreshold = 1
ForceSuppressed = false
HIDScrollZoomModifierMask = 0
SecondClickThreshold = 1
TrackpadCornerSecondaryClick = 0
TrackpadFiveFingerPinchGesture = 2
TrackpadFourFingerHorizSwipeGesture = 2
TrackpadFourFingerPinchGesture = 2
TrackpadFourFingerVertSwipeGesture = 2
TrackpadHandResting = true
TrackpadHorizScroll = 1
TrackpadMomentumScroll = true
TrackpadPinch = 1
TrackpadRightClick = true
TrackpadRotate = 1
TrackpadScroll = true
TrackpadThreeFingerDrag = false
TrackpadThreeFingerHorizSwipeGesture = 2
TrackpadThreeFingerTapGesture = 0
TrackpadThreeFingerVertSwipeGesture = 2
TrackpadTwoFingerDoubleTapGesture = 1
TrackpadTwoFingerFromRightEdgeSwipeGesture = 3
USBMouseStopsTrackpad = 0

[bootstrap.macos.defaults."com.apple.HIToolbox"]
AppleFnUsageType = 1
AppleCurrentKeyboardLayoutInputSourceID = "com.apple.keylayout.ABC"
