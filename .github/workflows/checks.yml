name: Check userland

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  shell:
    runs-on: macos-15
    steps:
      - name: Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          submodules: recursive
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.8.9
          install: true
          cache: true

      - name: Lint
        run: mise run lint

      - name: Test
        run: mise run test
