    aliases: ["ea"]
    path: life/ea-poc
    apps:
      browser:
        tabs:
          - https://github.com/giacomoguidotto/ea-poc
      terminal: {}
      editor: {}

  tempo:
    name: Tempo
    path: life/tempo
    apps:
      browser:
        tabs:
          - https://github.com/giacomoguidotto/tempo
          - https://expo.dev/accounts/giacomoguidotto/projects/tempo
